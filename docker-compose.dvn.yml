# Self-operated DVN workers, brought into the bosphor stack so Prometheus can
# scrape them by service name (dvn-evm:9301, dvn-solana:9302). The DVN lives in a
# SEPARATE repo at ../bosphor-dvn (host-specific path + its own secrets), so this
# overlay is only usable on a host that has it checked out, exactly like the
# testnet-relayer overlay. One image, three entrypoints: two forward workers
# (evm->sui, solana->sui) plus the sui->evm RETURN worker that verifies+executes
# the relayer's lz_send_proof on Sepolia (required for M4 escrow release; M3 used
# the owner confirmExecution fallback, which the M4 adapter makes non-releasing).
#
# Deploy alongside the rest of the stack so they share the network:
#   docker compose -f docker-compose.yml -f docker-compose.hosting.yml \
#     -f docker-compose.dvn.yml up -d --build dvn-evm dvn-solana dvn-evm-return
#
# IMPORTANT: stop any host-process DVN first. Two DVNs on one pathway race to
# verify+commit the same nonce and collide on Sui object versions.
services:
  dvn-evm:
    build: ../bosphor-dvn
    container_name: bosphor-dvn-evm
    command: ["npm", "run", "start"]
    env_file: ../bosphor-dvn/.env
    environment:
      - DVN_METRICS_PORT=9301
      - DVN_STATE_DIR=/data
    volumes:
      # Persisted poll cursors: a recreate resumes where it left off instead of
      # re-scanning history (429 bursts on free RPCs, missed-packet window on EVM).
      - dvn-state:/data
    ports:
      - "9301:9301"
    restart: unless-stopped

  dvn-solana:
    build: ../bosphor-dvn
    container_name: bosphor-dvn-solana
    command: ["npm", "run", "start-solana"]
    env_file: ../bosphor-dvn/.env
    environment:
      - DVN_METRICS_PORT=9302
      - DVN_STATE_DIR=/data
    volumes:
      - dvn-state:/data
    ports:
      - "9302:9302"
    restart: unless-stopped

  # Sui -> Sepolia RETURN worker. Watches the Sui endpoint's PacketSentEvent for
  # the relayer's lz_send_proof, then verify + commitVerification + lzReceive on
  # Sepolia (as DVN + executor, EOA 0x9665). This is what releases the M4 escrow.
  # No metrics server and no cursor file: it re-scans Sui each poll and skips
  # nonces < RETURN_MIN_NONCE (strict). RUN=1 makes it actually send (else
  # dry-run). MIN_NONCE=2 skips the already-delivered return nonce 1 (re-touching
  # an executed nonce re-sends a wasted verify tx every poll); bump it past the
  # highest already-delivered return nonce after each manual one-shot recovery.
  dvn-evm-return:
    build: ../bosphor-dvn
    container_name: bosphor-dvn-evm-return
    command: ["npm", "run", "return"]
    env_file: ../bosphor-dvn/.env
    environment:
      - DVN_STATE_DIR=/data
      - RUN=1
      - RETURN_MIN_NONCE=2
    volumes:
      - dvn-state:/data
    restart: unless-stopped

  # Sui -> Solana devnet RETURN worker. The Solana analogue of dvn-evm-return:
  # watches the Sui PacketSentEvent for the relayer's lz_send_proof(40168), then
  # endpoint.initVerify + uln.initVerify + verify + commitVerification + lz_receive
  # on Solana (as DVN + executor), which releases the M4 escrow. Lives in
  # scripts/solana (the LZ Solana SDK home); no cursor file, re-scans each poll and
  # skips nonces < RETURN_MIN_NONCE. RUN=1 makes it actually send. Sui endpoint /
  # OApp ids are passed explicitly (no relayer/.env.testnet inside the container).
  dvn-solana-return:
    build: ./scripts/solana
    container_name: bosphor-dvn-solana-return
    command: ["npm", "run", "solana-return"]
    environment:
      - RUN=1
      - RETURN_MODE=loop
      - RETURN_MIN_NONCE=2
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_KEYPAIR=/keypair.json
      - SUI_ENDPOINT_V2=0xabf9629418d997fcc742a5ca22820241b72fb53691f010bc964eb49b4bd2263a
      - SUI_LZ_PACKAGE_ID=0xbaa795269923a56b3159e974ca05350318bcb6e629aea618d01fc496543efee5
    volumes:
      - /home/arb/.config/solana/bosphor-devnet.json:/keypair.json:ro
    restart: unless-stopped

volumes:
  # Shared by both workers; each pathway writes its own cursor-<pathway>.json.
  dvn-state:
