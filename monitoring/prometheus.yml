global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The mainnet relayer (bosphor-relayer-1), reachable over the compose network.
  # /metrics is served on the relayer's internal METRICS_PORT (9464), never on
  # the public API port 3000.
  - job_name: bosphor-relayer
    static_configs:
      - targets: ['relayer:9464']
        labels:
          deployment: mainnet
    metrics_path: /metrics

  # The testnet relayer (bosphor-relayer-testnet) is a separate compose project.
  # Its API is published on the host at :3399; its internal metrics port (9464
  # in the container) must be published on the host at :9465 (bound to the
  # docker bridge, NOT routed through the tunnel / nginx). Reach it via the
  # docker host gateway (the prometheus service declares host.docker.internal in
  # docker-compose). This is the relayer that drives the canary + demo traffic.
  - job_name: bosphor-relayer-testnet
    static_configs:
      - targets: ['host.docker.internal:9465']
        labels:
          deployment: testnet
    metrics_path: /metrics

  - job_name: bosphor-canary
    static_configs:
      - targets: ['canary:9300']
    metrics_path: /metrics

  # Self-operated DVN workers. Only present when the DVN overlay
  # (docker-compose.dvn.yml) is deployed; otherwise these targets show down,
  # which is harmless. Each worker serves its own pathway on its own port.
  - job_name: bosphor-dvn
    static_configs:
      - targets: ['dvn-evm:9301', 'dvn-solana:9302']
    metrics_path: /metrics
