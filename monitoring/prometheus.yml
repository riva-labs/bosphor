global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Alerts go to Alertmanager, which pushes them to the operator's phone via ntfy.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # The mainnet relayer (bosphor-relayer-1), reachable over the compose network.
  # It still runs a pre-0.15 build that serves /metrics on the API port 3000.
  # Relayer 0.15+ serves it only on the internal METRICS_PORT (9464): switch this
  # target to 'relayer:9464' in the same change that upgrades the mainnet relayer.
  - job_name: bosphor-relayer
    static_configs:
      - targets: ['relayer:3000']
        labels:
          deployment: mainnet
    metrics_path: /metrics

  # The testnet relayer (bosphor-relayer-testnet) is a separate compose project.
  # Its API is published on the host at :3399; its internal metrics port (9464
  # in the container) must be published on the host at :9465 (bound to the
  # docker bridge, NOT routed through the tunnel / nginx). Reach it via the
  # docker host gateway (the prometheus service declares host.docker.internal in
  # docker-compose). This is the relayer that drives the canary + demo traffic.
  - job_name: bosphor-relayer-testnet
    static_configs:
      - targets: ['host.docker.internal:9465']
        labels:
          deployment: testnet
    metrics_path: /metrics

  - job_name: bosphor-canary
    static_configs:
      - targets: ['canary:9300']
    metrics_path: /metrics

  # Self-operated DVN workers. Only present when the DVN overlay
  # (docker-compose.dvn.yml) is deployed; otherwise these targets show down,
  # which is harmless. Each worker serves its own pathway on its own port.
  - job_name: bosphor-dvn
    static_configs:
      - targets: ['dvn-evm:9301', 'dvn-solana:9302']
    metrics_path: /metrics

  # Return DVN workers (Sui -> EVM, Sui -> Solana). Same metric names as the
  # forward workers, so the DVN alerts cover the return legs too.
  - job_name: bosphor-dvn-return
    static_configs:
      - targets: ['dvn-evm-return:9303', 'dvn-solana-return:9304']
    metrics_path: /metrics

  # Public endpoint probes: catches outages the protocol canary cannot see
  # (demo dApp, its Drive index, docs, status page, the public relayer APIs).
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://demo.bosphor.xyz
          - https://api.bosphor.xyz/health
          - https://api.bosphor.xyz/testnet/health
          - https://supabase.bosphor.xyz/
          - https://docs.bosphor.xyz
          - https://bosphor.xyz
          - https://status.bosphor.xyz
          - https://waitlist.bosphor.xyz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: target
      - target_label: __address__
        replacement: blackbox:9115

  # Nightly Postgres backups (monitoring/backup).
  - job_name: pg-backup
    static_configs:
      - targets: ['pg-backup:9310']
    metrics_path: /metrics

  # The alerting pipeline itself.
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
