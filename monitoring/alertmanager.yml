# Routes Prometheus alerts (monitoring/alerts.yml) to the operator's phone via
# the self-hosted ntfy server. Critical pages immediately and repeats hourly
# until resolved; warnings repeat daily. Resolved notices are always sent.
route:
  receiver: ntfy-warning
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h
  routes:
    # Mainnet is paused until after M5 (#535): its relayer is unfunded on
    # purpose. Drop its alerts until launch, then delete this route.
    - matchers: [deployment="mainnet"]
      receiver: blackhole
    # Daily proof the alert pipeline itself is alive. If this stops arriving,
    # Prometheus or Alertmanager is down.
    - matchers: [alertname="Watchdog"]
      receiver: ntfy-heartbeat
      repeat_interval: 24h
    # When template-based delivery itself is failing, page with a plain
    # message that does not depend on the ntfy template.
    - matchers: [alertname="BosphorAlertDeliveryFailing"]
      receiver: ntfy-plain
      repeat_interval: 1h
    - matchers: [severity="critical"]
      receiver: ntfy-critical
      repeat_interval: 1h

# A down canary makes its own staleness/round-trip alerts redundant noise.
inhibit_rules:
  - source_matchers: [alertname="BosphorCanaryDown"]
    target_matchers: [job="bosphor-canary"]
    equal: [job]

receivers:
  - name: blackhole
  - name: ntfy-critical
    webhook_configs:
      - url: http://ntfy/bosphor-alerts?template=bosphor&priority=urgent&tags=rotating_light
        send_resolved: true
        http_config: &ntfy_auth
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/ntfy_token
  - name: ntfy-warning
    webhook_configs:
      - url: http://ntfy/bosphor-alerts?template=bosphor&priority=default&tags=warning
        send_resolved: true
        http_config: *ntfy_auth
  - name: ntfy-heartbeat
    webhook_configs:
      - url: http://ntfy/bosphor-alerts?template=bosphor&priority=min&tags=heartbeat
        send_resolved: false
        http_config: *ntfy_auth
  - name: ntfy-plain
    webhook_configs:
      - url: http://ntfy/bosphor-alerts?title=Bosphor%20alert%20delivery%20is%20failing&priority=urgent&tags=rotating_light
        send_resolved: false
        http_config: *ntfy_auth
