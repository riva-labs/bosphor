# Optional overlay to run the canary against TESTNET (free) instead of the
# mainnet .env. Loaded last so .env.canary-testnet overrides .env per-variable.
# Bring up only the canary, without touching the running relayer/monitoring:
#   docker compose -f docker-compose.yml -f docker-compose.hosting.yml \
#     -f docker-compose.canary-testnet.yml up -d --build --no-deps canary
services:
  canary:
    env_file:
      - .env
      - .env.canary-testnet
    volumes:
      # Solana devnet keypair the Solana probe submits with. Point
      # SOLANA_CANARY_KEYPAIR at this path in .env.canary-testnet. Deliberately NOT
      # the relayer / dvn-solana-return keypair (bosphor-devnet.json): probes burn
      # LZ fees, and a drained canary wallet must never stop production returns.
      - /home/arb/.config/solana/bosphor-canary-devnet.json:/home/arb/.config/solana/bosphor-canary-devnet.json:ro
