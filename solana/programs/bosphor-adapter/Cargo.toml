[package]
name = "bosphor-adapter"
version = "0.1.0"
description = "Bosphor Solana adapter: on-chain intent submission and receive-proof state machine"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "bosphor_adapter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
# Reuse the canonical Bosphor commitment codec (encode + derive_intent_id + keccak).
# Path dependency to the sibling workspace crate; kept byte-for-byte identical to the
# TypeScript, Solidity, and Move implementations via the shared parity vectors.
bosphor-commitment-codec = { path = "../../commitment-codec" }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
