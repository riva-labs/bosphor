[workspace]
members = [
    "programs/*",
]
# commitment-codec is a chain-agnostic crate with its own workspace root (so its
# CI job resolves standalone without the LayerZero submodule). Exclude it here so
# `cargo metadata` / `anchor build` on this workspace does not see a nested root.
exclude = [
    "commitment-codec",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
