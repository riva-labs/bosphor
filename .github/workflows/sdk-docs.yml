# Builds and deploys the developer portal (sdk-docs/, served at sdk.bosphor.xyz
# until the docs.bosphor.xyz cutover) to Cloudflare Workers.
#
# `npm run build` also runs the post-build checks: internal links and anchors,
# the retired-URL redirect map, and the redirect Worker tests. Pull requests run
# the build as a gate; only pushes to main deploy.
#
# The SDK reference is generated from sdk/src with TypeDoc, and the relayer HTTP
# API reference from relayer/openapi/openapi.yaml, both at build time, so the
# site is rebuilt when the docs, the SDK source or the relayer spec changes. The
# build reads the spec at ../relayer/openapi from the full checkout.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   - CLOUDFLARE_API_TOKEN  (a token with Workers Scripts:Edit on the account)
#   - CLOUDFLARE_ACCOUNT_ID (the account that owns the bosphor.xyz zone)
# The custom domain sdk.bosphor.xyz is declared in sdk-docs/wrangler.jsonc and is
# bound on the first deploy; no dashboard step is needed once the secrets exist.
name: Deploy SDK Docs

on:
  push:
    branches: [main]
    paths:
      - 'sdk-docs/**'
      - 'sdk/src/**'
      - 'sdk/package.json'
      - 'sdk/tsconfig.json'
      - 'relayer/openapi/**'
  pull_request:
    paths:
      - 'sdk-docs/**'
      - 'sdk/src/**'
      - 'sdk/package.json'
      - 'sdk/tsconfig.json'
      - 'relayer/openapi/**'
      - 'website/docs/**'
      - '.github/workflows/sdk-docs.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy the developer portal
    runs-on: ubuntu-latest
    env:
      # Lifted to env so the deploy step can be skipped (not failed) until the
      # Cloudflare secrets are provisioned. The build still runs and gates the PR.
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install SDK deps (TypeDoc resolves sdk/src imports)
        run: cd sdk && npm ci
      - name: Install, build and check the portal
        run: |
          cd sdk-docs
          npm ci
          npm run build
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sdk-docs
