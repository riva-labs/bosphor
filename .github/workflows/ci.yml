name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      solana: ${{ steps.filter.outputs.solana }}
      relayer_image: ${{ steps.filter.outputs.relayer_image }}
      canary_image: ${{ steps.filter.outputs.canary_image }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            solana:
              - 'contracts/solana/**'
              - '.github/workflows/ci.yml'
            relayer_image:
              - 'relayer/**'
              - '.github/workflows/ci.yml'
            canary_image:
              - 'canary/**'
              - 'sdk/**'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
            e2e:
              - 'contracts/**'
              - 'relayer/**'
              - 'sdk/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  forge-tests:
    name: Forge Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run forge tests
        run: forge test -vvv
        working-directory: contracts/evm

  move-tests:
    name: Move Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Sui CLI
        id: cache-sui
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/sui
          key: sui-cli-${{ runner.os }}-testnet-v1.72.2

      - name: Install Sui CLI
        if: steps.cache-sui.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/sui-install
          curl -fsSL "https://github.com/MystenLabs/sui/releases/download/testnet-v1.72.2/sui-testnet-v1.72.2-ubuntu-x86_64.tgz" -o /tmp/sui-install/sui.tgz
          tar -xzf /tmp/sui-install/sui.tgz -C /tmp/sui-install ./sui
          sudo mv /tmp/sui-install/sui /usr/local/bin/sui

      - name: Run Move tests
        run: sui move test --build-env testnet
        working-directory: contracts/sui/lz-receiver

  relayer-build-and-test:
    name: Relayer Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: relayer/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: relayer

      - name: Lint
        run: npm run lint
        working-directory: relayer

      - name: Build
        run: npm run build
        working-directory: relayer

      - name: Test
        run: npm test
        working-directory: relayer

  sdk-tests:
    name: SDK Tests & Parity Vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sdk

      - name: Typecheck
        run: npm run typecheck
        working-directory: sdk

      - name: Build (publishable dist)
        run: npm run build
        working-directory: sdk

      - name: Validate package (publint + attw)
        run: npm run lint:package
        working-directory: sdk

      - name: Run parity + unit tests
        run: npm test
        working-directory: sdk

      - name: Parity vectors are in sync with the reference codec
        run: |
          npm --prefix sdk run gen:vectors
          if ! git diff --exit-code -- shared/parity/commitment-vectors.json contracts/sui/lz-receiver/tests/commitment_vectors.move contracts/solana/commitment-codec/tests/parity_vectors.rs; then
            echo "::error::Parity vectors drifted from the TypeScript reference codec. Run 'npm run gen:vectors' in sdk/ and commit the result."
            exit 1
          fi

  rust-commitment-codec:
    name: Rust Commitment Codec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test
        working-directory: contracts/solana/commitment-codec

  solana-build:
    name: Solana Program Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.solana == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # avm and the SBF build need different Rust toolchains. avm compiles from
      # source and needs a recent stable (its deps require rustc >= 1.91), so keep
      # stable as the default. The SBF build uses the nightly pinned by
      # contracts/solana/rust-toolchain.toml for host-side macro expansion; install it too so
      # anchor build does not have to fetch it on demand.
      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly-2025-06-30 --profile minimal --component rustfmt --component clippy
          rustup default stable

      # agave 3.1.10 + anchor 0.32.1 + the SBF platform-tools are all heavy to
      # install (avm compiles anchor from source), so cache them across runs.
      - name: Cache Solana + Anchor toolchain
        id: cache-toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/solana/install/releases/3.1.10
            ~/.cache/solana
            ~/.avm
            ~/.cargo/bin/avm
            ~/.cargo/bin/anchor
          key: solana-toolchain-${{ runner.os }}-agave3.1.10-anchor0.32.1-v2

      - name: Install Solana CLI (agave 3.1.10)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"

      - name: Install Anchor 0.32.1 via avm
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1

      # Put the pinned solana release first on PATH (the installer's active_release
      # symlink can point at an incomplete build) and select anchor 0.32.1.
      - name: Configure toolchain PATH
        run: |
          echo "$HOME/.local/share/solana/install/releases/3.1.10/solana-release/bin" >> "$GITHUB_PATH"
          avm use 0.32.1

      - name: Cache Solana build target
        uses: actions/cache@v6
        with:
          path: contracts/solana/target
          key: solana-target-${{ runner.os }}-${{ hashFiles('contracts/solana/Cargo.lock') }}
          restore-keys: |
            solana-target-${{ runner.os }}-

      # --no-idl: default anchor build fails only in IDL generation because the
      # vendored LZ endpoint-interface macros do not expand under 0.32.1 idl-build.
      # The compiled .so is correct; the SDK owns the program interface (no IDL).
      - name: Build Solana program
        run: anchor build --no-idl
        working-directory: contracts/solana

  # Build every container image the stack deploys, so an unbuildable image is
  # caught at PR time instead of deploy time. Build-only: no push, no registry
  # credentials.
  relayer-image:
    name: Relayer Image Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.relayer_image == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build relayer image
        uses: docker/build-push-action@v6
        with:
          context: relayer
          file: relayer/Dockerfile
          push: false
          cache-from: type=gha,scope=relayer-image
          cache-to: type=gha,mode=max,scope=relayer-image

  canary-image:
    name: Canary Image Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.canary_image == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Context is the repo root, not ./canary: the canary Dockerfile depends on
      # the sibling sdk/ and the root tsconfig.base.json (same as the compose
      # files build it).
      - name: Build canary image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: canary/Dockerfile
          push: false
          cache-from: type=gha,scope=canary-image
          cache-to: type=gha,mode=max,scope=canary-image

  # Cross-chain e2e gate: runs the full EVM -> LayerZero -> Sui/Walrus -> EVM
  # round trip (npm run test:e2e) against the live testnet deployment on PRs
  # that touch the cross-chain path. Docs, website, and monitoring changes
  # never trigger it (see the e2e path filter above).
  #
  # Off by default. The owner enables it with:
  #   1. Repository variable E2E_GATE_ENABLED set to 'true'.
  #   2. Repository secret E2E_ENV_FILE: the full dotenv contents the e2e
  #      script needs (EVM_RPC_URL, EVM_ADAPTER_ADDRESS, EVM_RELAYER_KEY,
  #      RELAYER_URL, plus optional SUI_GRPC_URL, SUI_PACKAGE_ID,
  #      SUI_LZ_PACKAGE_ID, SUI_EID, WALRUS_STORE_EPOCHS, LZ_OPTIONS).
  #      The secret is written to a file and passed via BOSPHOR_ENV_FILE,
  #      which scripts/test/e2e-test.ts already resolves through dotenv.
  #   3. After one green soak run, make "Cross-Chain E2E (testnet)" a
  #      required check in branch protection. Do not require it before the
  #      secret is provisioned, or every cross-chain PR blocks on a skip.
  #
  # Emergency skip: add the 'skip-e2e' label to the PR. Label changes alone
  # do not retrigger the workflow, so push a commit (or close and reopen the
  # PR) after labeling.
  #
  # Fork safety: fork PRs cannot read secrets. The availability step below
  # turns that into a clean skip with a notice instead of a failure.
  #
  # Serialization: the fixed concurrency group guarantees two PRs never run
  # e2e simultaneously against the same testnet state. Runs queue, they are
  # never cancelled mid-flight (a cancelled run would strand a live intent).
  e2e-testnet:
    name: Cross-Chain E2E (testnet)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.e2e == 'true' &&
      vars.E2E_GATE_ENABLED == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-e2e')
    concurrency:
      group: e2e-testnet
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # secrets.* cannot be used in a job-level if, so check availability in
      # a step and gate everything after it on the output. This covers fork
      # PRs and the window before the owner provisions the secret.
      - name: Check e2e secret availability
        id: gate
        env:
          E2E_ENV_FILE: ${{ secrets.E2E_ENV_FILE }}
        run: |
          if [ -n "$E2E_ENV_FILE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_ENV_FILE is not available (fork PR, or the secret is not provisioned yet). Skipping the live testnet e2e run."
          fi

      - name: Setup Node.js
        if: steps.gate.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json

      - name: Install root dependencies
        if: steps.gate.outputs.available == 'true'
        run: npm ci

      # The e2e script imports the SDK from source (sdk/src), which resolves
      # its own dependencies from sdk/node_modules.
      - name: Install SDK dependencies
        if: steps.gate.outputs.available == 'true'
        run: npm ci
        working-directory: sdk

      - name: Write e2e env file
        if: steps.gate.outputs.available == 'true'
        env:
          E2E_ENV_FILE: ${{ secrets.E2E_ENV_FILE }}
        run: |
          umask 077
          printf '%s\n' "$E2E_ENV_FILE" > "$RUNNER_TEMP/bosphor-e2e.env"

      - name: Run cross-chain e2e against live testnet
        if: steps.gate.outputs.available == 'true'
        env:
          BOSPHOR_ENV_FILE: ${{ runner.temp }}/bosphor-e2e.env
        run: npm run test:e2e

  brand-check:
    name: Brand Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No em dashes in tracked files
        run: |
          if git grep -lP "\x{2014}" -- . ; then
            echo "::error::Em dash (U+2014) found in tracked files. Use a hyphen, comma, or period per the brand rule."
            exit 1
          fi
