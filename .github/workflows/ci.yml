name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  forge-tests:
    name: Forge Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run forge tests
        run: forge test -vvv
        working-directory: contracts/evm

  move-tests:
    name: Move Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Sui CLI
        id: cache-sui
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/sui
          key: sui-cli-${{ runner.os }}-testnet-v1.72.2

      - name: Install Sui CLI
        if: steps.cache-sui.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/sui-install
          curl -fsSL "https://github.com/MystenLabs/sui/releases/download/testnet-v1.72.2/sui-testnet-v1.72.2-ubuntu-x86_64.tgz" -o /tmp/sui-install/sui.tgz
          tar -xzf /tmp/sui-install/sui.tgz -C /tmp/sui-install ./sui
          sudo mv /tmp/sui-install/sui /usr/local/bin/sui

      - name: Run Move tests
        run: sui move test --build-env testnet
        working-directory: sui/lz-receiver

  relayer-build-and-test:
    name: Relayer Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: relayer/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: relayer

      - name: Build
        run: npm run build
        working-directory: relayer

      - name: Test
        run: npm test
        working-directory: relayer

  sdk-tests:
    name: SDK Tests & Parity Vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sdk

      - name: Typecheck
        run: npm run typecheck
        working-directory: sdk

      - name: Run parity + unit tests
        run: npm test
        working-directory: sdk

      - name: Parity vectors are in sync with the reference codec
        run: |
          npm --prefix sdk run gen:vectors
          if ! git diff --exit-code -- shared/parity/commitment-vectors.json sui/lz-receiver/tests/commitment_vectors.move solana/commitment-codec/tests/parity_vectors.rs; then
            echo "::error::Parity vectors drifted from the TypeScript reference codec. Run 'npm run gen:vectors' in sdk/ and commit the result."
            exit 1
          fi

  rust-commitment-codec:
    name: Rust Commitment Codec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test
        working-directory: solana/commitment-codec

  brand-check:
    name: Brand Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No em dashes in tracked files
        run: |
          if git grep -lP "\x{2014}" -- . ; then
            echo "::error::Em dash (U+2014) found in tracked files. Use a hyphen, comma, or period per the brand rule."
            exit 1
          fi
