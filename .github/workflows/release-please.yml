name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Use a PAT when available so the release-PR merge below re-triggers
          # this workflow to create the component tags/releases. The default
          # GITHUB_TOKEN cannot trigger workflows, so an auto-merged release PR
          # is left "untagged" and blocks every future release. Falls back to
          # GITHUB_TOKEN when the secret is absent (PR creation still works).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Enable auto-merge on any release PRs created by release-please.
      # Requires "Allow auto-merge" enabled in repo Settings > General.
      # If branch protection requires status checks, the merge waits for CI.
      - name: Auto-merge release PRs
        if: steps.release.outputs.prs_created == 'true'
        env:
          # Same token as above: merging with a PAT re-triggers this workflow so
          # the merged release PR gets tagged. GITHUB_TOKEN merges do not.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          PRS_JSON: ${{ steps.release.outputs.prs }}
        run: |
          echo "$PRS_JSON" | jq -r '.[].number' | while read pr; do
            echo "Enabling auto-merge for PR #$pr"
            gh pr merge "$pr" --auto --merge --repo "${{ github.repository }}" || true
          done
