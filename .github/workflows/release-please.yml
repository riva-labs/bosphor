name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # The action itself uses GITHUB_TOKEN to open the release PR and create
          # tags: it has the needed contents/PR write scope and is proven to work
          # (it created #97 and #190). The PAT is only used for the AUTO-MERGE
          # step below, so that merging the release PR re-triggers this workflow
          # to tag it (a GITHUB_TOKEN merge cannot trigger workflows). Using the
          # PAT for the action instead failed tree creation ("Error adding to
          # tree") when the fine-grained token lacked contents write.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Enable auto-merge on any release PRs created by release-please.
      # Requires "Allow auto-merge" enabled in repo Settings > General.
      # If branch protection requires status checks, the merge waits for CI.
      - name: Auto-merge release PRs
        if: steps.release.outputs.prs_created == 'true'
        env:
          # Same token as above: merging with a PAT re-triggers this workflow so
          # the merged release PR gets tagged. GITHUB_TOKEN merges do not.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          PRS_JSON: ${{ steps.release.outputs.prs }}
        run: |
          echo "$PRS_JSON" | jq -r '.[].number' | while read pr; do
            echo "Enabling auto-merge for PR #$pr"
            gh pr merge "$pr" --auto --merge --repo "${{ github.repository }}" || true
          done
