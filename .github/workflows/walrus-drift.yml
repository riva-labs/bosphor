name: Walrus Drift

# Fails when Walrus upgrades its on-chain package past the one the Sui executor
# links. On 2026-10-19 that upgrade made every execute_store abort until the
# executor was relinked by hand (#486). A red run here is the early warning.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/sui/executor/Move.lock'
      - 'scripts/util/walrus-drift*.ts'
      - '.github/workflows/walrus-drift.yml'

jobs:
  drift:
    name: Walrus Drift (${{ matrix.network }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        network: [testnet, mainnet]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Unit tests
        run: npx --yes tsx --test scripts/util/walrus-drift.test.ts

      - name: Check the linked Walrus package is still current
        run: npx --yes tsx scripts/util/walrus-drift.ts
        env:
          NETWORK: ${{ matrix.network }}
