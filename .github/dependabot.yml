version: 2

# Policy: auto-propose minor/patch only. Major bumps are deliberate migrations
# (they have broken the build before: TypeScript 7, Babel 8, OpenZeppelin 5),
# so we ignore semver-major here and bump those by hand when ready.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /relayer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /sdk-docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /canary
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /chaos
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions: allow minor/patch and major (CI validates them).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Git submodules (forge-std, openzeppelin-contracts): minor/patch only.
  # Submodules track commits, not semver, so the semver-major rule alone does
  # not stop the OpenZeppelin submodule from jumping to v5 master. The project
  # stays on OpenZeppelin v4.9.6 on purpose: LayerZero v2 OApp depends on the
  # v4 Ownable semantics. Bump it by hand when that migration is planned.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "contracts/evm/lib/openzeppelin-contracts"
