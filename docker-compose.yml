# Memory limits: sized from observed steady-state usage (2026-08-31 snapshot)
# with 4-8x headroom, so one leaking process cannot OOM the host. The OOM killer
# then targets the offending container, whose restart policy brings it back.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bosphor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bosphor}
      POSTGRES_DB: bosphor
    volumes:
      - bosphor-pgdata:/var/lib/postgresql/data
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bosphor -d bosphor"]
      interval: 10s
      timeout: 5s
      retries: 5

  relayer:
    build: ./relayer
    env_file: .env
    ports:
      - "3000:3000"
    # Headroom for staged blob buffers (BYTEA payloads are fetched lazily, but a
    # store batch can hold several blobs in memory at once).
    mem_limit: 1536m
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  canary:
    # Root context: the canary depends on the sibling sdk/ via file:../sdk, so the
    # build needs both packages (see canary/Dockerfile).
    build:
      context: .
      dockerfile: canary/Dockerfile
    env_file: .env
    # The canary embeds the SDK and encodes probe blobs in-process; observed
    # ~420MB steady state.
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      - relayer

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
      # Metric history survives container recreates (post-mortems need it).
      - bosphor-promdata:/prometheus
    ports:
      - "9090:9090"
    # Lets Prometheus scrape host-published services (e.g. the testnet relayer on
    # :3399, which runs in a separate compose project) via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 512m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      # Set GRAFANA_ADMIN_PASSWORD in .env for any non-local deployment. The
      # fallback exists only so a fresh clone boots for local dev.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-bosphor}
      # External URL Grafana is served from (grafana.bosphor.xyz via the tunnel).
      # Needed for correct login redirects and asset URLs behind the subdomain.
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
      # Injected into the Bosphor Postgres datasource provisioning for the
      # internal intent-lifecycle table panel.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bosphor}
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      # Home-dashboard preference, public-share tokens, and alerting state
      # survive recreates. Supersedes the grafana-apply.sh ritual: run the
      # script once after this volume first mounts to seed the state, then
      # recreates keep it.
      - bosphor-grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    mem_limit: 512m
    restart: unless-stopped

# status.bosphor.xyz is served by Kener (see kener/), routed through the
# Cloudflare tunnel to host port 3008. Uptime Kuma was retired at cutover.

volumes:
  bosphor-pgdata:
  bosphor-promdata:
  bosphor-grafanadata:
