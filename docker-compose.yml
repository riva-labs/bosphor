# Memory limits: sized from observed steady-state usage (2026-08-31 snapshot)
# with 4-8x headroom, so one leaking process cannot OOM the host. The OOM killer
# then targets the offending container, whose restart policy brings it back.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bosphor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bosphor}
      POSTGRES_DB: bosphor
    volumes:
      - bosphor-pgdata:/var/lib/postgresql/data
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bosphor -d bosphor"]
      interval: 10s
      timeout: 5s
      retries: 5

  relayer:
    build: ./relayer
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    # Internal Prometheus scrape port (METRICS_PORT). Reachable by prometheus over
    # the compose network only; deliberately not published on the host.
    expose:
      - "9464"
    # Headroom for staged blob buffers (BYTEA payloads are fetched lazily, but a
    # store batch can hold several blobs in memory at once).
    mem_limit: 1536m
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  canary:
    # Root context: the canary depends on the sibling sdk/ via file:../sdk, so the
    # build needs both packages (see canary/Dockerfile).
    build:
      context: .
      dockerfile: canary/Dockerfile
    env_file: .env
    # The canary embeds the SDK and encodes probe blobs in-process; observed
    # ~420MB steady state.
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      - relayer

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
      # Metric history survives container recreates (post-mortems need it).
      - bosphor-promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    # Lets Prometheus scrape host-published services (e.g. the testnet relayer's
    # metrics port :9465, which runs in a separate compose project) via
    # host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 512m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      # Set GRAFANA_ADMIN_PASSWORD in .env for any non-local deployment. The
      # fallback exists only so a fresh clone boots for local dev.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-bosphor}
      # External URL Grafana is served from (grafana.bosphor.xyz via the tunnel).
      # Needed for correct login redirects and asset URLs behind the subdomain.
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
      # Injected into the Bosphor Postgres datasource provisioning for the
      # internal intent-lifecycle table panel.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bosphor}
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      # Home-dashboard preference, public-share tokens, and alerting state
      # survive recreates. Supersedes the grafana-apply.sh ritual: run the
      # script once after this volume first mounts to seed the state, then
      # recreates keep it.
      - bosphor-grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    mem_limit: 512m
    restart: unless-stopped

  # Pushes Prometheus alerts to the operator's phone through ntfy. Routing and
  # repeat policy live in monitoring/alertmanager.yml. The ntfy access token is
  # read from monitoring/secrets/ntfy_token (gitignored, created at setup).
  alertmanager:
    image: prom/alertmanager:latest
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      # Directory mounts (not single files) so edits are seen on reload.
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/secrets:/etc/alertmanager/secrets:ro
      - bosphor-amdata:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    mem_limit: 128m
    restart: unless-stopped

  # Self-hosted push notifications (ntfy.bosphor.xyz via the cloudflared tunnel,
  # host port 3020). Private: deny-all by default, operator user + token only.
  ntfy:
    image: binwiederhier/ntfy:latest
    command: ["serve"]
    volumes:
      - ./monitoring/ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ./monitoring/ntfy/templates:/etc/ntfy/templates:ro
      - bosphor-ntfydata:/var/lib/ntfy
    ports:
      - "127.0.0.1:3020:80"
    mem_limit: 128m
    restart: unless-stopped

  # HTTP probes of the public endpoints (targets in monitoring/prometheus.yml).
  blackbox:
    image: prom/blackbox-exporter:latest
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    mem_limit: 64m
    restart: unless-stopped

  # Nightly offsite Postgres backups to Cloudflare R2 (#345). Dumps the relayer
  # databases and the demo dApp Drive index, keeps 30 days, and exposes
  # bosphor_backup_* metrics on :9310 for the backup alerts.
  pg-backup:
    build: ./monitoring/backup
    env_file:
      - ./monitoring/secrets/backup.env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bosphor}
      - DAPP_INDEX_PASSWORD=dapp_index_local
      - BACKUP_TARGETS=postgres|5432|bosphor|POSTGRES_PASSWORD|bosphor postgres|5432|bosphor|POSTGRES_PASSWORD|bosphor_testnet dapp-index-db|5432|postgres|DAPP_INDEX_PASSWORD|dapp
    mem_limit: 256m
    restart: unless-stopped

# status.bosphor.xyz is served by Kener (see kener/), routed through the
# Cloudflare tunnel to host port 3008. Uptime Kuma was retired at cutover.

volumes:
  bosphor-pgdata:
  bosphor-promdata:
  bosphor-grafanadata:
  bosphor-amdata:
  bosphor-ntfydata:
